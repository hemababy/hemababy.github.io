<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Hemalatha Sekar</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
  <link rel="stylesheet" href="assests/css/main.css" />
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f8f9fa;
      position: relative;
      overflow-x: hidden;
    }
    .section {
      padding: 4rem 0;
      position: relative;
      z-index: 1;
    }
    .contact-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
      padding: 2rem;
      max-width: 700px;
      margin: 0 auto;
      position: relative;
      z-index: 2;
    }
    .contact-card h2 {
      font-weight: 600;
      margin-bottom: 1.5rem;
    }
    .form-control:focus {
      box-shadow: 0 0 0 0.2rem rgba(102, 16, 242, 0.25);
    }
    .floating-icons img {
      position: absolute;
      width: 40px;
      height: 40px;
      opacity: 0.7;
      animation: floatIcon 5s infinite ease-in-out alternate;
    }
    .floating-icons img:nth-child(1) {
      top: 10%; left: 8%; animation-delay: 0s;
    }
    .floating-icons img:nth-child(2) {
      top: 30%; right: 10%; animation-delay: 1s;
    }
    .floating-icons img:nth-child(3) {
      bottom: 20%; left: 12%; animation-delay: 2s;
    }
    .floating-icons img:nth-child(4) {
      bottom: 10%; right: 5%; animation-delay: 3s;
    }
    .floating-icons img:nth-child(5) {
      top: 50%; left: 50%; animation-delay: 4s;
    }
    @keyframes floatIcon {
      0% { transform: translateY(0); opacity: 0.6; }
      50% { transform: translateY(-20px) rotate(5deg); opacity: 0.4; }
      100% { transform: translateY(20px) rotate(-5deg); opacity: 0.6; }
    }
  </style>

  <div id="navbar-placeholder"></div>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
  $("#navbar-placeholder").load("_includes/header.html");
</script>
</head>
<body>
  <div class="floating-icons">
    <img src="assests/images/message.png" alt="floating icon">
    <img src="assests/images/message.png" alt="floating icon">
    <img src="assests/images/message.png" alt="floating icon">
    <img src="assests/images/message.png" alt="floating icon">
    <img src="assests/images/message.png" alt="floating icon">
  </div>

  <section class="section container" data-aos="fade-up">
    <div class="contact-card">
      <h2 class="text-center">Get in Touch</h2>
      <p class="text-center">I'm always open to collaborating, mentoring, or answering questions related to data science, development, or career transitions. Drop me a message below or email me directly at <a href="mailto:hematechie@gmail.com">hematechie@gmail.com</a>.</p>
      <form action="https://formspree.io/f/mwkgvzqw" method="POST" class="mt-4">
        <div class="mb-3">
          <label for="name" class="form-label">Name</label>
          <input type="text" class="form-control" name="name" required>
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" name="email" required>
        </div>
        <div class="mb-3">
          <label for="message" class="form-label">Message</label>
          <textarea class="form-control" name="message" rows="4" required></textarea>
        </div>
        <div class="text-center">
          <button type="submit" class="btn btn-primary px-4">Send Message</button>
        </div>
      </form>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
  <script>AOS.init();</script>
</body>
</html>
